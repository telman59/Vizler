<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">My Website</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <!-- Одна строка: кнопки языков | заголовок + описание | фото -->
  <div class="header-top">

    <div id="lang-switch">
      <button onclick="setLang('TJ')">TJ</button>
      <button onclick="setLang('UZ')">UZ</button>
      <button onclick="setLang('EN')">EN</button>
      <button onclick="setLang('RU')">RU</button>
    </div>

    <div class="title-block">
      <h1 id="page-title">Loading...</h1>
      <p id="page-description"></p>
    </div>

    <div class="photo-block">
      <img src="assets/me.png" alt="me">
    </div>

  </div>

  <nav id="main-menu"></nav>
  <div id="breadcrumbs"></div>

</header>

<main>
  <div id="content-area">
    Select a menu item...
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
